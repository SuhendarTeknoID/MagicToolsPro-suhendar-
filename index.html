    <style>
        :root {
            --glass-bg: rgba(15, 23, 42, 0.85);
            --accent-glow: rgba(99, 102, 241, 0.6);
            --gold-glow: rgba(245, 158, 11, 0.4);
            --dropdown-bg: #0f172a;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b1120;
            color: #f8fafc;
            background-image: 
                radial-gradient(circle at 10% 10%, var(--accent-glow) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, var(--gold-glow) 0%, transparent 40%);
            background-attachment: fixed;
            min-height: 100vh;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 20px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .input-style {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 12px 16px;
            color: #f8fafc;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            width: 100%;
            appearance: none;
        }

        .input-style:focus {
            outline: none;
            border-color: #818cf8;
            background: rgba(15, 23, 42, 0.9);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.2);
        }

        .input-style option {
            background-color: var(--dropdown-bg);
            color: #ffffff;
            padding: 10px;
        }

        .input-style optgroup {
            background-color: #1e293b;
            color: #818cf8;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 11px;
        }

        .btn-generate {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
            filter: brightness(1.1);
        }

        .btn-reset {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .btn-reset:hover {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.3);
            color: #f87171;
        }

        .copy-badge {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .copy-badge:hover {
            background: rgba(99, 102, 241, 0.2);
            color: #818cf8;
            border-color: #6366f1;
        }
    </style>

                            <div class="flex justify-between items-center mb-1">
                                <label class="text-[8px] font-black text-gray-500 uppercase tracking-widest">Full Script Narrative</label>
                                <button onclick="copyContent('resFullDialogue')" class="copy-badge scale-75">COPY ALL</button>
                            </div>
                            <p id="resFullDialogue" class="text-xs italic text-indigo-100/80 leading-snug"></p>
                        </div>
                    </div>

                    <div id="sceneContainer" class="space-y-6 pb-20"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function generateMagic() {
            const btn = document.getElementById('genBtn');
            const loading = document.getElementById('loading');
            const result = document.getElementById('resultContent');
            const sceneContainer = document.getElementById('sceneContainer');

            const params = {
                objek: document.getElementById('objekUtama').value,
                suara: document.getElementById('karakterSuara').value,
                persona: document.getElementById('persona').value,
                visual: document.getElementById('visualStyle').value,
                konteks: document.getElementById('storyContext').value,
                count: parseInt(document.getElementById('sceneCount').value),
                dur: parseInt(document.getElementById('sceneDuration').value)
            };

            if(!params.objek) return;

            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-spinner animate-spin"></i> Magic Processing...`;
            loading.classList.remove('hidden');
            result.classList.add('hidden');
            sceneContainer.innerHTML = '';

            try {
                const systemPrompt = `Act as a viral creator for "Object Talk" videos. Create a script where ${params.objek} speaks.
                Structure: 1. Strong Hook, 2. Escalation, 3. Facts/Origin, 4. Wow Factor, 5. Apex, 6. Twist, 7. CTA.
                
                PRODUCTION STANDARDS (STRICT):
                - Dialogue: STRICTLY Bahasa Indonesia (Cinematic, use [Intonation/Expression] tags like [Sinis], [Tertawa Kecil], [Nada Rendah]).
                - SCENE CONTINUITY: Every scene must logically connect to the next one to form a single cohesive narrative.
                - CINEMATIC CAMERA: Vary camera angles for each scene to maintain visual interest (e.g., Extreme Close-up on details, Low-angle powerful shot, Side-profile tracking, Wide context shot).
                - Master Character Prompt: Specific English description of the object's appearance AND its unique vocal characteristics/tone (based on ${params.suara}) to ensure identity remains identical across all scenes.
                - Master Prompt: Shared English baseline for consistency.
                - i2vPrompt: MUST include the Indonesian dialogue text, ASMR description, specific camera movement directions (e.g., "Camera slowly zooms in on the object's eyes"), and vocal delivery style.`;
                
                const userPrompt = `OBJECT: ${params.objek}, VOICE: ${params.suara}, PERSONA: ${params.persona}, VISUAL: ${params.visual}, CONTEXT: ${params.konteks}, SCENES: ${params.count}, DURATION: ${params.dur}s.`;

                const apiKey = ""; 
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: userPrompt }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] },
                        generationConfig: { 
                            responseMimeType: "application/json",
                            responseSchema: {
                                type: "OBJECT",
                                properties: {
                                    masterPrompt: { type: "STRING" },
                                    masterCharacterPrompt: { type: "STRING" },
                                    totalWords: { type: "NUMBER" },
                                    scenes: {
                                        type: "ARRAY",
                                        items: {
                                            type: "OBJECT",
                                            properties: {
                                                sceneNumber: { type: "NUMBER" },
                                                dialogue: { type: "STRING" },
                                                asmr: { type: "STRING" },
                                                t2iPrompt: { type: "STRING" },
                                                negativePrompt: { type: "STRING" },
                                                i2vPrompt: { type: "STRING" },
                                                wordCount: { type: "NUMBER" }
                                            }
                                        }
                                    }
                                }
                            }
                        }
                    })
                });

                const data = await response.json();
                const output = JSON.parse(data.candidates[0].content.parts[0].text);
                renderResults(output, params);

            } catch (error) {
                console.error(error);
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fas fa-wand-magic-sparkles"></i> GENERATE MAGIC PRO`;
                loading.classList.add('hidden');
            }
        }

        function renderResults(data, input) {
            const container = document.getElementById('sceneContainer');
            const resultPanel = document.getElementById('resultContent');

            document.getElementById('resTotalScene').innerText = data.scenes.length;
            document.getElementById('resTotalDurasi').innerText = (data.scenes.length * input.dur) + 's';
            document.getElementById('resTotalWords').innerText = data.totalWords || 0;
            document.getElementById('resFullDialogue').innerText = data.scenes.map(s => s.dialogue).join(' ');

            let masterHtml = `
                <div class="glass-card p-4 bg-amber-500/5 border-amber-500/20">
                    <h3 class="text-amber-400 font-black text-[8px] tracking-widest mb-4 uppercase">Master Assets Control</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="bg-black/40 p-3 rounded-xl border border-white/5">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-[7px] text-gray-500 font-black uppercase">MASTER PROMPT</span>
                                <button onclick="copyRawText(this)" class="copy-badge scale-75">COPY</button>
                            </div>
                            <p class="text-[11px] text-gray-300 font-mono leading-tight">${data.masterPrompt}</p>
                        </div>
                        <div class="bg-black/40 p-3 rounded-xl border border-white/5">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-[7px] text-gray-500 font-black uppercase">CHARACTER PROMPT</span>
                                <button onclick="copyRawText(this)" class="copy-badge scale-75">COPY</button>
                            </div>
                            <p class="text-[11px] text-gray-300 font-mono leading-tight">${data.masterCharacterPrompt}</p>
                        </div>
                    </div>
                </div>
            `;
            container.innerHTML = masterHtml;

            data.scenes.forEach(s => {
                const html = `
                    <div class="glass-card overflow-hidden">
                        <div class="bg-indigo-500/10 p-3 flex justify-between items-center border-b border-white/5">
                            <div class="flex items-center gap-3">
                                <span class="bg-indigo-600 text-white font-black px-2 py-0.5 rounded text-[9px] tracking-widest uppercase">Scene ${s.sceneNumber}</span>
                                <span class="text-[9px] font-bold text-indigo-300 opacity-60"><i class="far fa-clock mr-1"></i> ${input.dur}s</span>
                                <span class="text-[9px] font-bold text-indigo-300 opacity-60"><i class="fas fa-microphone mr-1"></i> ${s.wordCount || 0} Words</span>
                                <span class="text-[8px] bg-white/10 px-2 py-0.5 rounded-full text-white font-bold tracking-tighter">ID-INDONESIA</span>
                            </div>
                        </div>
                        <div class="p-5 grid grid-cols-1 lg:grid-cols-2 gap-6">
                            <div class="space-y-5">
                                <!-- Bagian 1: Dialog & Intonasi -->
                                <div>
                                    <div class="flex justify-between items-center mb-2">
                                        <label class="text-[9px] uppercase font-black text-indigo-400 tracking-widest">Voice Dialogue (Bahasa Indonesia)</label>
                                        <button onclick="copyRawText(this)" class="copy-badge scale-75">COPY</button>
                                    </div>
                                    <div class="bg-indigo-900/20 p-4 rounded-xl border border-indigo-500/10">
                                        <p class="text-[12px] font-bold text-white leading-relaxed mb-1">${s.dialogue}</p>
                                        <p class="text-[9px] italic text-indigo-300/60"><i class="fas fa-music mr-1"></i> ${s.asmr || 'Ambient sound'}</p>
                                    </div>
                                </div>
                                <!-- Bagian 2: Gambar -->
                                <div>
                                    <div class="flex justify-between items-center mb-2">
                                        <label class="text-[9px] uppercase font-black text-gray-500 tracking-widest">T2I Image Prompt</label>
                                        <button onclick="copyRawText(this)" class="copy-badge scale-75">COPY</button>
                                    </div>
                                    <div class="bg-black/30 p-3 rounded-lg border border-white/5">
                                        <p class="text-[12px] text-gray-400 font-mono leading-snug">${s.t2iPrompt}</p>
                                    </div>
                                </div>
                            </div>
                            <div class="space-y-5">
                                <!-- Bagian 3: Filter Negatif (Sekarang di urutan ke-3) -->
                                <div>
                                    <div class="flex justify-between items-center mb-2">
                                        <label class="text-[9px] uppercase font-black text-red-400/40 tracking-widest">Negative Prompt</label>
                                        <button onclick="copyRawText(this)" class="copy-badge scale-75">COPY</button>
                                    </div>
                                    <div class="bg-red-950/10 p-3 rounded-lg border border-red-500/5">
                                        <p class="text-[11px] text-red-200/30 font-mono">${s.negativePrompt || 'deformed, blurry, low quality'}</p>
                                    </div>
                                </div>
                                <!-- Bagian 4: Video Motion (Paling Akhir) -->
                                <div>
                                    <div class="flex justify-between items-center mb-2">
                                        <label class="text-[9px] uppercase font-black text-amber-400 tracking-widest">I2V Motion & ASMR Control (Final Step)</label>
                                        <button onclick="copyRawText(this)" class="copy-badge scale-75">COPY</button>
                                    </div>
                                    <div class="bg-amber-900/10 p-4 rounded-xl border border-amber-500/10">
                                        <p class="text-[12px] text-amber-100/80 leading-relaxed font-medium">${s.i2vPrompt}</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += html;
            });

            resultPanel.classList.remove('hidden');
            resultPanel.scrollIntoView({ behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('objekUtama').value = '';
            document.getElementById('storyContext').value = '';
            document.getElementById('resultContent').classList.add('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function copyContent(id) {
            const el = document.getElementById(id);
            copyAction(el.innerText, event.target);
        }

        function copyRawText(btn) {
            const target = btn.closest('div').nextElementSibling;
            copyAction(target.innerText, btn);
        }

        function copyAction(text, btn) {
            const temp = document.createElement('textarea');
            temp.value = text;
            document.body.appendChild(temp);
            temp.select();
            document.execCommand('copy');
            document.body.removeChild(temp);
            
            const original = btn.innerText;
            btn.innerText = "COPIED!";
            btn.style.color = "#4ade80";
            setTimeout(() => {
                btn.innerText = original;
                btn.style.color = "";
            }, 2000);
        }
    </script>
</body>
</html>
